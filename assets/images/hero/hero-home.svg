<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b2e"/>
      <stop offset="0.55" stop-color="#12314f" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#173a5e"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a1f" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff7a1f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#ffffff" stroke-width="2">
    <line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>
  </g>
  <polygon points="0,0 900,0 300,1080 0,1080" fill="url(#stripe)"/>
  <!-- derrick silhouette -->
  <g transform="translate(1300,180)" stroke="#ff9a3d" stroke-width="6" stroke-linejoin="round" fill="none" opacity="0.85">
    <polygon points="180,0 260,700 100,700"/>
    <line x1="120" y1="560" x2="240" y2="560"/>
    <line x1="108" y1="420" x2="252" y2="420"/>
    <line x1="130" y1="280" x2="230" y2="280"/>
    <line x1="150" y1="150" x2="210" y2="150"/>
    <line x1="180" y1="0" x2="100" y2="700"/>
    <line x1="180" y1="0" x2="260" y2="700"/>
  </g>
  <rect x="60" y="900" width="1800" height="6" fill="#ff7a1f" opacity="0.5"/>
  <text x="60" y="1040" font-family="Arial, sans-serif" font-size="26" letter-spacing="2" fill="#ffffff" opacity="0.35">PLACEHOLDER IMAGE — replace with assets/images/hero/hero-home.jpg</text>
</svg>
